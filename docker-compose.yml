# Krishi Mitra -- local development stack.
#
# Brings up Qdrant (server mode, replacing the old local file-mode store)
# and MongoDB (chat history). The backend itself is NOT containerized here;
# run it directly with `python main.py` after these two services are up, so
# it can use CPU-loaded embedding/reranker models without a GPU passthrough
# or a slow rebuild loop.
#
# Usage:
#   docker compose up -d
#   cd backend && python vector_db.py   # seed the Qdrant collection
#   cd backend && python main.py        # start the API
#
# Set QDRANT_URL=http://localhost:6333 and MONGO_URI=mongodb://localhost:27017
# in backend/.env (see backend/.env.example).
services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: krishi-mitra-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: krishi-mitra-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  qdrant_data:
  mongo_data:
