name: tests
on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install from the lock file
        run: pip install -r backend/requirements.lock
      # Pure invariant tests: no network, no LLM, no database. They include the
      # refusal smoke tests (tests/invariants/test_tiers.py, test_fact_answer.py).
      - name: pytest
        working-directory: backend
        run: python -m pytest -q
