[pytest]
# Only collect from backend/tests/. Scripts like quick_test.py and
# eval/refusal_test.py match pytest's default *_test.py naming convention
# but are manual, live-service scripts (they require a running Qdrant
# collection, MongoDB, and a valid LLM API key) -- not automated tests.
# Without this, `pytest` from backend/ fails to even collect.
testpaths = tests
